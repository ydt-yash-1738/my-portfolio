<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Obsidian to Deep Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151C" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Crimson Accent Gradient -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333D" />
      <stop offset="100%" stop-color="#E51B24" />
    </linearGradient>

    <!-- Subtle White Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDEDF0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Bold Architectural 'Y' Glyph (Syne 800 aesthetic) -->
  <path d="M 14 14 L 23 14 L 32 28 L 41 14 L 50 14 L 36.5 33 L 36.5 50 L 27.5 50 L 27.5 33 Z" fill="url(#glyphGrad)" />

  <!-- Signature Editorial Crimson Dot / Status Accent -->
  <circle cx="49" cy="46" r="3.75" fill="url(#redAccent)" />
</svg>
